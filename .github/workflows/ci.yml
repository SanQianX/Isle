name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Lint, typecheck, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # High/critical findings in production dependencies block the release
      # (TEST_STRATEGY §8). Dev-only tooling findings are reported but do not
      # fail the gate; see ADR-013 for the accepted set.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report dev-dependency findings (non-blocking)
        run: npm audit --audit-level=critical || true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (isolated SQLite + disk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run fixtures:generate
      - run: npm run test:integration -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [static, unit, integration, build]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `project` is the name of the Playwright project in playwright.config.ts;
        # `browser` is the browser binary that has to be installed for it. They
        # are not the same list: "mobile-chrome" is a project that runs the
        # chromium binary with a phone's device profile, and "mobile-webkit"
        # runs webkit the same way. Passing the project name to
        # `playwright install` is an error -- "Invalid installation targets:
        # 'mobile-chrome'" -- so the two mobile jobs never installed anything.
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run fixtures:generate
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: [static, build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run fixtures:generate
      - run: npm run build
      # All three engines, so the committed Linux baselines cover every browser
      # project the suite runs. Installing only chromium meant the other four
      # projects had no baseline to compare against -- the job could not pass
      # and the difference between the engines went unchecked.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:visual
      # The baselines live in the repository, and they are the authoritative
      # ones: they are generated on this runner, reviewed by a human, and
      # committed (ADR-007). A missing baseline fails this job on purpose and
      # uploads what it generated, so the diff can be reviewed before it is
      # accepted. It is never updated in place.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 14
