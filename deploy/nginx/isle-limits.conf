# ISLE — http-level rate limiting.
#
# Include inside the `http { }` block of nginx.conf, once.
#
# The key is the client binary address, and it is only populated for write
# methods. Reads (GET/HEAD on previews) therefore never consume the budget,
# which matters because a single gallery page can fire dozens of image
# requests; limiting those at 2r/s would break the site for exactly the
# visitors we want to keep.

map $request_method $isle_write_key {
  default        "";
  POST           $binary_remote_addr;
  PUT            $binary_remote_addr;
  PATCH          $binary_remote_addr;
  DELETE         $binary_remote_addr;
}

# Writes: 2 per second sustained, with a burst of 20.
limit_req_zone $isle_write_key zone=isle_writes:10m rate=2r/s;

# Log the zone so `journalctl`/access logs can show rejections (DEPLOY §9).
limit_req_status 429;
limit_req_log_level warn;
