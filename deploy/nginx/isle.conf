# ISLE — HTTPS vhost.
#
# Replace server_name and the certificate paths before deploying. This file is
# a template: `deploy.sh` renders it from /etc/isle/isle.env rather than
# storing a hostname in the repository.
#
# Node listens on 127.0.0.1 only. Nothing here ever exposes the media
# directory directly -- originals are served by the application, which applies
# its own access rules and headers.

limit_req_zone $isle_write_key zone=isle_writes:10m rate=2r/s;

upstream isle_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;   # replaced at deploy time

    # ACME challenges stay on plain HTTP so renewal keeps working behind TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name photos.example.com;   # replaced at deploy time

    # PLACEHOLDER-TLS
    ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. HSTS is deliberately absent from the staging template:
    # adding it on a test domain can lock out local testing for months.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # A single photo is capped at 25 MiB; the extra megabyte absorbs multipart
    # framing so a legal upload is never refused at the proxy.
    client_max_body_size 26m;
    client_body_timeout 120s;

    # Friends-only by default (DEPLOY §3). The htpasswd file lives outside the
    # repository; this is access control at the edge, not an in-app account.
    auth_basic           "ISLE";
    auth_basic_user_file /etc/nginx/isle.htpasswd;

    access_log /var/log/nginx/isle.access.log;
    error_log  /var/log/nginx/isle.error.log warn;

    location /api/ {
        limit_req zone=isle_writes burst=20 nodelay;

        proxy_pass http://isle_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Uploads and originals are large and streamed; the default 60s read
        # timeout cuts long downloads off mid-file.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
        proxy_buffering       off;
    }

    # Immutable build assets can be cached hard; HTML must not be.
    location /_next/static/ {
        proxy_pass http://isle_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://isle_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
